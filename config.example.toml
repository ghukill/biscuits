# biscuits configuration. Default location: ~/.biscuits/config.toml
# Create it with `biscuits config init`. It holds secrets: keep it mode 600.
#
# Changes are picked up on the next request, without a restart. The exception
# is [server], [storage] and [auth], which need `biscuits restart`.

[openproject]
url = "https://openproject.example.org"
# Used only for managing accounts and looking up names, never to read or change
# tasks. Ideally a dedicated OpenProject admin account, not a person's key.
admin_token = "an-openproject-admin-api-key"
# The Docker container OpenProject runs in, for the key command on the admin screen.
container = "openproject"

[writes]
# "preview": nothing is sent to OpenProject; edits apply in the browser only.
# "live":    edits are sent for the projects listed below.
mode = "preview"
# OpenProject project ids that may be written in live mode, or "*" for all.
projects = []

[server]
host = "127.0.0.1"
port = 9173
# URL prefix, if a reverse proxy serves biscuits under a sub-path, e.g. "/biscuits".
base_path = "/"
# Behind a reverse proxy, the proxy's address. Only then is X-Forwarded-Proto
# believed, which is how biscuits knows the connection is HTTPS. Without it,
# session cookies aren't marked Secure and the "isn't HTTPS" note stays up.
# trusted_proxy = "127.0.0.1"
# A name for this server, shown with the version in the sidebar, e.g. "dev @ 0.5.0",
# so it's obvious which one you're on. Without it, the sidebar shows just the version.
# Applies without a restart.
# environment = "prod"

[auth]
# `biscuits config init` and `biscuits config add-auth-keys` generate these.
# Signs login sessions. Changing it signs everyone out.
secret_key = "at-least-32-random-characters"
# Encrypts users' OpenProject API keys in the database. If this is lost, every
# key has to be entered again. Back it up separately from the database.
encryption_key = "a-fernet-key"

[storage]
# Where the database, snapshot caches, write log, pid file and server log live.
# Defaults to the directory holding this file.
# data_dir = "~/.biscuits"

# Optional. Needed only for `biscuits agent`, which starts a Claude Code session
# signed in as a dedicated, non-admin OpenProject account.
# [agent]
# token = "the-agent-accounts-openproject-api-key"
# Tasks assigned to the agent in this project are offered in the session.
# project = 56
# Where the session starts. Defaults to the current directory.
# workdir = "/path/to/biscuits"
# Planning docs kept outside the repo, if any. The session can read and edit them.
# docs = "/path/to/planning/biscuits"
# The biscuits MCP endpoint the session goes through, and a file holding a
# biscuits API token for the agent's biscuits account
# (`biscuits tokens add biscuits-agent --name agent-session --out FILE`).
# Set both or neither. Without them, the session talks to OpenProject directly
# (`biscuits mcp-direct`).
# mcp_url = "http://your-biscuits-host:8000/mcp"
# mcp_token_file = "~/.biscuits/agent-session.token"

# Optional. Programs use biscuits over MCP at <base_path>/mcp, each with an API
# token (`biscuits tokens add`). They're only accepted from these addresses or
# networks. The default is this machine and the tailnet (Tailscale's ranges):
# [mcp]
# allow_from = ["127.0.0.1/32", "::1/128", "100.64.0.0/10", "fd7a:115c:a1e3::/48"]
