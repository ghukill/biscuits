[project]
name = "biscuits"
version = "0.2.0"
description = "Biscuits: an Asana-flavoured web UI for OpenProject"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "flask>=3.0",
    "waitress>=3.0",
]

[project.scripts]
biscuits = "biscuits.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biscuits"]

[tool.pytest.ini_options]
testpaths = ["tests"]
