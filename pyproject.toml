[project]
name = "biscuits"
version = "0.8.0"
description = "Biscuits: an Asana-flavoured web UI for OpenProject"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "click>=8.1",
    "cryptography>=42",
    "flask>=3.0",
    "flask-login>=0.6.3",
    "sqlalchemy>=2.0",
    "waitress>=3.0",
]

[project.scripts]
biscuits = "biscuits.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biscuits"]

# Records `git describe` in the wheel, for the version label. See hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
