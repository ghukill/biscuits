<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>biscuits</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23d9a066'/><circle cx='11' cy='12' r='1.6' fill='%237a4a22'/><circle cx='19' cy='10.5' r='1.6' fill='%237a4a22'/><circle cx='20.5' cy='18.5' r='1.6' fill='%237a4a22'/><circle cx='12.5' cy='20' r='1.6' fill='%237a4a22'/></svg>">
  <link rel="stylesheet" href="{{ url_for('biscuits.static', filename='vendor/tabulator/tabulator.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('biscuits.static', filename='biscuits.css') }}">
</head>
<body data-base="{{ url_for('biscuits.index')[:-1] }}">
  <aside class="side">
    <div class="side-top">
      <a class="brand" href="{{ url_for('biscuits.index') }}home" data-nav>
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><circle class="chip" cx="11" cy="12" r="1.7"/><circle class="chip" cx="19" cy="10.5" r="1.7"/><circle class="chip" cx="20.5" cy="18.5" r="1.7"/><circle class="chip" cx="12.5" cy="20" r="1.7"/></svg></span>
        <span>biscuits</span>
      </a>
      <button class="icon-btn" id="side-toggle" title="Toggle sidebar" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 5v14"/></svg></button>
    </div>
    <nav class="side-nav" id="side-main"></nav>
    <div class="side-h">Projects</div>
    <nav class="side-nav side-projects" id="side-projects"></nav>
    <div class="side-foot" id="side-foot"></div>
    <div class="side-account">
      <a href="{{ url_for('biscuits.index') }}account" data-nav class="side-me" title="My account">{{ current_user.display_name }}</a>
      {% if current_user.is_admin %}<a href="{{ url_for('biscuits.index') }}admin" data-nav title="Manage accounts">Accounts</a>{% endif %}
      <button type="button" id="logout" class="linkish">Sign out</button>
    </div>
  </aside>
  <div class="main">
    {% if not request.is_secure %}<div class="https-note" title="Passwords and task data aren't encrypted by biscuits on this connection. A VPN such as Tailscale still encrypts them in transit.">This connection isn't HTTPS.</div>{% endif %}
    <header class="topbar">
      <div class="search-wrap">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search tasks, projects, people…" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <div class="typeahead" id="typeahead" hidden></div>
      </div>
      <div class="sync" id="sync">
        <span class="sync-dot"></span><span id="sync-text">Loading…</span>
        <button id="sync-btn" class="icon-btn" title="Refresh from OpenProject" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </div>
    </header>
    <main class="view" id="view"><div class="tl-empty shimmer">Gathering your work from OpenProject…</div></main>
  </div>
  <aside class="pane" id="pane" aria-label="Task details"></aside>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="{{ url_for('biscuits.static', filename='vendor/tabulator/tabulator.min.js') }}"></script>
  <script type="module" src="{{ url_for('biscuits.static', filename='js/main.js') }}"></script>
</body>
</html>
